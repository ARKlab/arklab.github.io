<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="420" style="border-collapse:collapse;width:420px;max-width:100%;mso-table-lspace:0pt;mso-table-rspace:0pt;">
  <tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:19px;line-height:24px;font-weight:700;color:#102326;">{{NAME}}</td></tr>
  {{#TITLE}}<tr><td style="padding:2px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:17px;color:#626D73;">{{TITLE}}</td></tr>{{/TITLE}}
  <tr><td style="padding:10px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#102326;"><a href="{{EMAIL_HREF}}" style="font-family:Arial,Helvetica,sans-serif;font-size:13px;color:#102326;text-decoration:none;">{{EMAIL}}</a></td></tr>
  {{#PHONES}}<tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:13px;line-height:21px;color:#102326;">{{PHONES}}</td></tr>{{/PHONES}}
  <tr><td style="padding:18px 0 0;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;"><tr>
      <td width="110" valign="middle" style="width:110px;padding:0 20px 0 0;"><a href="{{ARK_URL}}" style="text-decoration:none;"><img src="{{ARK_LOGO}}" alt="ARK" width="90" height="30" border="0" style="display:block;width:90px;height:30px;border:0;"></a></td>
      <td valign="middle" style="border-left:2px solid #3D78FF;padding:0 0 0 16px;">
        <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;"><tr><td style="padding:0 0 5px;font-family:Arial,Helvetica,sans-serif;font-size:10px;line-height:13px;letter-spacing:0.5px;color:#626D73;">{{RELATIONSHIP}}</td></tr><tr><td bgcolor="#0B1929" style="padding:6px 8px;background-color:#0B1929;"><img src="{{ARTESIAN_LOGO}}" alt="Artesian" width="104" height="30" border="0" style="display:block;width:104px;height:30px;border:0;"></td></tr></table>
      </td>
    </tr></table>
  </td></tr>
  <tr><td style="padding:11px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;font-weight:600;color:#102326;">{{DESCRIPTOR}}</td></tr>
  <tr><td style="padding:1px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:18px;color:#102326;"><a href="{{ARK_URL}}" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#102326;text-decoration:none;">{{ARK_LABEL}}</a>{{#ARTESIAN_URL}} <span style="color:#A5ADB1;">&nbsp;&middot;&nbsp;</span> <a href="{{ARTESIAN_URL}}" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;color:#006D7B;text-decoration:none;">{{ARTESIAN_LABEL}}</a>{{/ARTESIAN_URL}}</td></tr>
  {{#OFFICE}}<tr><td style="padding:8px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:16px;color:#626D73;">{{OFFICE}}</td></tr>{{/OFFICE}}
</table>
