<table role="presentation" border="0" cellpadding="0" cellspacing="0" width="360" style="border-collapse:collapse;width:360px;max-width:100%;mso-table-lspace:0pt;mso-table-rspace:0pt;">
  <tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:18px;line-height:23px;color:#102326;"><strong style="font-weight:700;">{{NAME}}</strong></td></tr>
  {{#TITLE}}<tr><td style="padding:1px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:17px;color:#626D73;">{{TITLE}}</td></tr>{{/TITLE}}
  <tr><td height="8" style="height:8px;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#34464C;"><a href="{{EMAIL_HREF}}" style="font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#34464C;text-decoration:none;"><span style="color:#34464C;text-decoration:none;">{{EMAIL}}</span></a></td></tr>
  {{#PHONES}}<tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:12px;line-height:19px;color:#34464C;">{{PHONES}}</td></tr>{{/PHONES}}
  <tr><td height="15" style="height:15px;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:0;">
    <table role="presentation" border="0" cellpadding="0" cellspacing="0" style="border-collapse:collapse;mso-table-lspace:0pt;mso-table-rspace:0pt;"><tr>
      <td width="92" valign="middle" style="width:92px;padding:0;"><a href="{{ARK_URL}}" style="text-decoration:none;"><img src="{{ARK_LOGO}}" alt="ARK" width="92" height="32" border="0" style="display:block;width:92px;height:32px;border:0;"></a></td>
      <td width="16" style="width:16px;font-size:0;line-height:0;">&nbsp;</td>
      <td width="1" bgcolor="#D9E1E1" style="width:1px;background-color:#D9E1E1;font-size:0;line-height:0;">&nbsp;</td>
      <td width="16" style="width:16px;font-size:0;line-height:0;">&nbsp;</td>
      <td valign="middle" style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:18px;color:#626D73;white-space:nowrap;">{{RELATIONSHIP}} {{ARTESIAN_LINK}}</td>
    </tr></table>
  </td></tr>
  <tr><td height="10" style="height:10px;font-size:0;line-height:0;">&nbsp;</td></tr>
  <tr><td style="padding:0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:17px;color:#526168;">{{DESCRIPTOR}}</td></tr>
  {{#OFFICE}}<tr><td style="padding:4px 0 0;font-family:Arial,Helvetica,sans-serif;font-size:11px;line-height:17px;color:#626D73;">{{OFFICE}}</td></tr>{{/OFFICE}}
</table>
